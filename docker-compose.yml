version: "3.9"

# Local development orchestration. See docs/architecture/Architecture.md §12
# for the corresponding production (Kubernetes) topology.

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: tenderiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenderiq
      POSTGRES_PASSWORD: tenderiq_local
      POSTGRES_DB: tenderiq
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tenderiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tenderiq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tenderiq
      MINIO_ROOT_PASSWORD: tenderiq_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: tenderiq-backend-api
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  notification-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: notification-worker
    container_name: tenderiq-notification-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: tenderiq-ai-engine
    restart: unless-stopped
    env_file:
      - ./ai-engine/.env.example
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ai-engine:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tenderiq-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.example
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  nginx:
    image: nginx:1.27-alpine
    container_name: tenderiq-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend-api
      - frontend

volumes:
  postgres-data:
  minio-data:
