name: deploy-staging

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend-api, notification-worker, ai-engine, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (placeholder)
        run: echo "Build & push tenderiq/${{ matrix.service }}:${GITHUB_SHA::7} — wired up in a later phase"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Apply staging overlay (placeholder)
        run: echo "kubectl apply -k docker/k8s/overlays/staging — wired up in a later phase"
