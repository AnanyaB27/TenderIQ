apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: backend-api
          image: tenderiq/backend-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: backend-api-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
        - name: notification-worker
          image: tenderiq/notification-worker:latest
          envFrom:
            - secretRef:
                name: backend-api-secrets
